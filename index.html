<!DOCTYPE html>
<html lang="zh-TW" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>紫墨數字風水 · 彭品心 官方網站</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwind.config = {
        theme: {
            extend: {
                colors: { paper: '#FDFBF7', ink: '#2C2416', gold: '#C5A059', 'gold-light': '#E2C275', 'gold-dark': '#9A793A', warm: '#F4EFEA', wood: '#3D2817' },
                fontFamily: { serif: ['"Noto Serif TC"', 'serif'] }
            }
        }
    }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Noto Serif TC', serif; background-color: #FDFBF7; color: #2C2416; letter-spacing: 0.025em; -webkit-user-select: none; user-select: none; }
        .chinese-border { border: 1.5px solid #C5A059; box-shadow: inset 0 0 16px rgba(197, 160, 89, 0.12), 0 4px 15px rgba(44, 36, 22, 0.05); }
        .bg-pattern { background-image: radial-gradient(#C5A059 0.5px, transparent 0.5px); background-size: 24px 24px; }
        .art-grid-card { background: #F4EFEA; border: 1.5px solid #C5A059; border-radius: 0.75rem; padding: 0.4rem; box-shadow: 0 4px 12px rgba(44, 36, 22, 0.06); display: flex; flex-direction: column; justify-content: space-between; animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .art-img-box { width: 100%; aspect-ratio: 1 / 1; background: #241A15; overflow: hidden; border-radius: 0.4rem; position: relative; }
        .art-img-box img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; -webkit-touch-callout: none; }
        .img-protect-overlay { position: absolute; inset: 0; z-index: 10; background: transparent; }
        .infinite-scroll-gallery { max-height: 650px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #C5A059 #F4EFEA; padding-right: 4px; }
        .infinite-scroll-gallery::-webkit-scrollbar { width: 5px; }
        .infinite-scroll-gallery::-webkit-scrollbar-thumb { background-color: #C5A059; border-radius: 3px; }
    </style>
</head>
<body class="bg-paper text-ink bg-pattern min-h-screen flex flex-col selection:bg-gold selection:text-white pb-32" oncontextmenu="return false;">

    <!-- 頂部導覽列 -->
    <header class="sticky top-0 z-40 bg-paper/95 backdrop-blur-md border-b-2 border-gold/40 shadow-md">
        <div class="max-w-3xl mx-auto px-3 py-2.5 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <div class="w-9 h-9 rounded-full bg-gradient-to-br from-gold-light/40 to-gold/20 flex items-center justify-center border-2 border-gold text-gold font-bold shadow text-base font-serif shrink-0">禪</div>
                <div>
                    <h1 class="text-xs sm:text-sm font-bold tracking-wider text-ink">紫墨數字風水</h1>
                    <p class="text-[10px] text-gold-dark font-semibold">彭品心老師官方網站</p>
                </div>
            </div>
            <div class="flex items-center space-x-1.5">
                <button onclick="toggleVip()" id="vip-btn" class="px-2 py-1 rounded-lg bg-warm border-2 border-gold text-gold text-[11px] font-bold transition flex items-center gap-1">
                    <i class="fa-solid fa-crown"></i><span id="vip-btn-text">VIP</span>
                </button>
                <button onclick="openCartModal()" class="relative p-2 rounded-lg bg-warm border-2 border-gold/60 text-gold flex items-center justify-center shadow-sm">
                    <i class="fa-solid fa-cart-shopping text-sm"></i>
                    <span id="cart-badge" class="absolute -top-1 -right-1 bg-gold text-white text-[9px] w-4 h-4 rounded-full flex items-center justify-center font-bold">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- 浮動購物車按鈕 -->
    <div class="fixed bottom-5 right-5 z-50">
        <button onclick="openCartModal()" class="bg-gradient-to-r from-gold-light via-gold to-gold-dark hover:brightness-110 text-white px-5 py-3.5 rounded-full shadow-[0_6px_25px_rgba(197,160,89,0.6)] flex items-center gap-2.5 border-2 border-paper font-bold">
            <i class="fa-solid fa-cart-shopping text-lg"></i>
            <span class="text-xs sm:text-sm">購物車與預約</span>
            <span id="floating-cart-count" class="bg-white text-gold text-xs px-2.5 py-0.5 rounded-full font-bold">0</span>
        </button>
    </div>

    <!-- 主內容區塊 -->
    <main class="max-w-2xl mx-auto px-3 py-4 sm:py-6 space-y-6 w-full">
        
        <!-- 老師專屬：手機直覺上架面板 -->
        <section class="bg-warm p-4 rounded-2xl chinese-border space-y-3 shadow-md">
            <h3 class="text-sm font-bold text-ink flex items-center gap-2"><i class="fa-solid fa-paintbrush text-gold"></i><span>老師專屬：點擊相簿直接上架</span></h3>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5 text-xs">
                <input type="text" id="new-art-name" placeholder="請輸入畫作名稱 (例: 牡丹迎春)" class="px-3 py-2 rounded-lg border-2 border-gold/40 bg-paper focus:outline-none focus:border-gold">
                <input type="number" id="new-art-price" placeholder="價格 (預設 680)" value="680" class="px-3 py-2 rounded-lg border-2 border-gold/40 bg-paper focus:outline-none focus:border-gold">
                <label class="bg-gradient-to-r from-gold-light via-gold to-gold-dark text-white py-2.5 rounded-lg font-bold text-center cursor-pointer hover:brightness-110 flex items-center justify-center gap-1.5 shadow">
                    <i class="fa-solid fa-images"></i><span>選擇手機相簿圖片上架</span>
                    <input type="file" accept="image/*" class="hidden" onchange="uploadDirectArt(event)">
                </label>
            </div>
            <p class="text-[10px] text-gold-dark font-semibold">💡 只要點擊按鈕從相簿選照片，系統就會立刻在下方生成一排多張網格與專屬購買按鈕！</p>
        </section>

        <!-- 畫廊展示區（手機2欄，電腦4欄，支援下滑滑軌） -->
        <section class="space-y-4">
            <div class="text-center space-y-1 pb-2 border-b-2 border-gold/40">
                <h3 class="text-lg sm:text-xl font-bold tracking-widest text-wood">品心美學 · 線上典藏畫廊</h3>
                <p class="text-xs text-gold-dark font-semibold">典藏原創藝術 · 支援下滑瀏覽與即時下單</p>
            </div>

            <!-- 無限下滑滑軌容器 -->
            <div class="infinite-scroll-gallery">
                <div id="art-gallery-grid" class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                    <!-- 預設範例畫作 -->
                    <div class="art-grid-card">
                        <div>
                            <div class="art-img-box"><div class="img-protect-overlay"></div><img src="1000053440.jpg" alt="福祿牡丹"></div>
                            <h4 class="font-bold text-xs text-ink mt-1.5 truncate">福祿牡丹（精選原創）</h4>
                        </div>
                        <div class="pt-2 border-t border-gold/20 flex items-center justify-between">
                            <span class="text-xs font-bold text-red-800 item-price">NT$ 680</span>
                            <button onclick="addToCart('福祿牡丹（精選原創）', 680)" class="bg-paper hover:bg-gold hover:text-white text-gold border border-gold px-2.5 py-1 rounded text-[11px] font-bold transition">購買</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 聯絡與版權宣告 -->
        <section class="bg-warm/80 p-5 rounded-2xl chinese-border text-center space-y-2 text-xs">
            <h4 class="font-bold text-ink">📞 聯絡彭品心老師</h4>
            <div class="flex justify-center gap-3 pt-1 font-bold">
                <a href="https://line.me" target="_blank" class="text-green-700 underline">官方 LINE 諮詢</a>
                <a href="mailto:bookspctv@gmail.com" class="text-gold-dark underline">Google 郵箱</a>
            </div>
            <p class="text-[10px] text-gray-500 pt-2">© 2026 彭品心老師 (紫墨老師) All Rights Reserved.</p>
        </section>

    </main>

    <!-- 購物車彈窗 -->
    <div id="cart-modal" class="fixed inset-0 z-50 bg-black/65 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-paper rounded-2xl max-w-md w-full p-6 chinese-border space-y-4 shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b-2 border-gold/30 pb-3">
                <h3 class="font-bold text-base text-ink tracking-wider">🛒 您的預約與購物車</h3>
                <button onclick="closeCartModal()" class="text-gray-500 hover:text-ink"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div id="modal-vip-status-text" class="text-xs text-gold-dark bg-warm/80 p-2.5 rounded-lg border border-gold/30 text-center font-bold">目前身分：一般會員</div>
            <div id="cart-items-container" class="space-y-3 max-h-40 overflow-y-auto text-xs divide-y divide-gold/10"></div>
            <div id="empty-cart-msg" class="text-center text-gray-500 py-4 text-xs font-medium">目前購物車是空的</div>
            <div class="border-t-2 border-gold/30 pt-3 space-y-2.5 text-xs font-medium">
                <h4 class="font-bold text-ink">📝 請填寫預約與結帳資訊：</h4>
                <div><label class="block text-gold-dark mb-1 font-semibold">您的姓名 *</label><input type="text" id="cust-name" placeholder="請輸入真實姓名" class="w-full px-3 py-2 rounded-lg border-2 border-gold/40 bg-warm/50 text-xs"></div>
                <div><label class="block text-gold-dark mb-1 font-semibold">聯絡電話 *</label><input type="tel" id="cust-phone" placeholder="請輸入聯絡電話" class="w-full px-3 py-2 rounded-lg border-2 border-gold/40 bg-warm/50 text-xs"></div>
                <div><label class="block text-gold-dark mb-1 font-semibold">LINE ID *</label><input type="text" id="cust-line" placeholder="請輸入您的 LINE ID" class="w-full px-3 py-2 rounded-lg border-2 border-gold/40 bg-warm/50 text-xs"></div>
                <div><label class="block text-gold-dark mb-1 font-semibold">收件地址 / 備註說明 *</label><textarea id="cust-target" rows="2" placeholder="請填寫收件地址或需求..." class="w-full px-3 py-2 rounded-lg border-2 border-gold/40 bg-warm/50 text-xs"></textarea></div>
            </div>
            <div class="border-t-2 border-gold/30 pt-3 flex justify-between items-center font-bold text-sm">
                <span>總計金額：</span><span id="cart-total-price" class="text-red-800 text-base">NT$ 0</span>
            </div>
            <button onclick="submitCheckout()" class="w-full bg-gradient-to-r from-gold-light via-gold to-gold-dark text-white py-3.5 rounded-xl text-xs font-bold shadow">確認送出訂單</button>
        </div>
    </div>

    <!-- JavaScript 核心邏輯 -->
    <script>
        let cart = [];
        let isVip = false;

        // 直接從手機相簿選取並上架
        function uploadDirectArt(event) {
            const file = event.target.files[0];
            if (!file) return;

            const nameInput = document.getElementById('new-art-name');
            const priceInput = document.getElementById('new-art-price');
            
            const artName = nameInput.value.trim() || '品心美學·典藏新作';
            const artPrice = parseInt(priceInput.value) || 680;

            const reader = new FileReader();
            reader.onload = function(e) {
                const imageSrc = e.target.result;
                const galleryGrid = document.getElementById('art-gallery-grid');
                const finalPrice = isVip ? Math.round(artPrice * 0.9) : artPrice;

                const card = document.createElement('div');
                card.className = 'art-grid-card';
                card.innerHTML = `
                    <div>
                        <div class="art-img-box"><div class="img-protect-overlay"></div><img src="${imageSrc}" alt="${artName}"></div>
                        <h4 class="font-bold text-xs text-ink mt-1.5 truncate">${artName}</h4>
                    </div>
                    <div class="pt-2 border-t border-gold/20 flex items-center justify-between">
                        <span class="text-xs font-bold text-red-800 item-price">NT$ ${finalPrice} ${isVip ? '<span class="text-[9px] text-emerald-600">9折</span>' : ''}</span>
                        <button onclick="addToCart('${artName}', ${artPrice})" class="bg-paper hover:bg-gold hover:text-white text-gold border border-gold px-2.5 py-1 rounded text-[11px] font-bold transition">購買</button>
                    </div>
                `;

                // 放到最前面讓老師立刻看到
                galleryGrid.prepend(card);
                nameInput.value = '';
                alert(`「${artName}」已成功上架！`);
            };
            reader.readAsDataURL(file);
        }

        function toggleVip() {
            isVip = !isVip;
            const btnText = document.getElementById('vip-btn-text');
            const modalVipText = document.getElementById('modal-vip-status-text');
            if (isVip) {
                btnText.innerText = "VIP (已享9折)";
                if (modalVipText) modalVipText.innerText = "目前身分：終身 VIP 會員 (全站 9 折中)";
            } else {
                btnText.innerText = "VIP";
                if (modalVipText) modalVipText.innerText = "目前身分：一般會員";
            }
            renderCart();
        }

        function addToCart(name, basePrice) {
            const finalPrice = isVip ? Math.round(basePrice * 0.9) : basePrice;
            cart.push({ name: name, price: finalPrice });
            renderCart();
            openCartModal();
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            renderCart();
        }

        function renderCart() {
            const container = document.getElementById('cart-items-container');
            const emptyMsg = document.getElementById('empty-cart-msg');
            const badge = document.getElementById('cart-badge');
            const floatingCount = document.getElementById('floating-cart-count');
            const totalPriceEl = document.getElementById('cart-total-price');

            if (!container) return;
            container.innerHTML = '';
            if (cart.length === 0) {
                if (emptyMsg) emptyMsg.style.display = 'block';
                if (badge) badge.innerText = '0';
                if (floatingCount) floatingCount.innerText = '0';
                if (totalPriceEl) totalPriceEl.innerText = 'NT$ 0';
                return;
            }

            if (emptyMsg) emptyMsg.style.display = 'none';
            if (badge) badge.innerText = cart.length;
            if (floatingCount) floatingCount.innerText = cart.length;

            let total = 0;
            cart.forEach((item, idx) => {
                total += item.price;
                const div = document.createElement('div');
                div.className = 'py-2 flex items-center justify-between text-xs font-semibold';
                div.innerHTML = `
                    <span class="text-stone-800">${item.name}</span>
                    <div class="flex items-center space-x-3">
                        <span class="font-bold text-wood">NT$ ${item.price}</span>
                        <button onclick="removeFromCart(${idx})" class="text-red-500">🗑</button>
                    </div>
                `;
                container.appendChild(div);
            });
            if (totalPriceEl) totalPriceEl.innerText = `NT$ ${total}`;
        }

        function openCartModal() { document.getElementById('cart-modal')?.classList.remove('hidden'); document.getElementById('cart-modal')?.classList.add('flex'); }
        function closeCartModal() { document.getElementById('cart-modal')?.classList.add('hidden'); document.getElementById('cart-modal')?.classList.remove('flex'); }

        function submitCheckout() {
            const name = document.getElementById('cust-name')?.value.trim() || '';
            const phone = document.getElementById('cust-phone')?.value.trim() || '';
            const line = document.getElementById('cust-line')?.value.trim() || '';
            const target = document.getElementById('cust-target')?.value.trim() || '';

            if (!name || !phone || !line || !target) {
                alert('請完整填寫姓名、電話、LINE ID 與收件地址！');
                return;
            }
            if (cart.length === 0) {
                alert('您的購物車是空的！');
                return;
            }

            alert(`感謝 ${name}老師/貴賓！您的購畫訂單已成功送出。\n我們將盡快透過 LINE (${line}) 與您確認寄送與付款事宜！`);
            cart = [];
            renderCart();
            closeCartModal();
        }
    </script>
</body>
</html>
